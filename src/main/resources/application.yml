spring:
  application:
    name: chat-service
  profiles:
    default: snowluma
  data:
    redis:
      host: localhost
      port: 6379
  cloud:
    nacos:
      discovery:
        username: nacos
        password: ${NACOS_PASSWORD}
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:atriplus}
    username: ${POSTGRES_USERNAME:postgres}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver
  config:
    import: optional:classpath:application-local.yml

mybatis:
  mapper-locations: classpath:/mapper/*.xml

media:
  vision:
    base-url: ${MEDIA_VISION_BASE_URL:https://api.deepseek.com}
    api-key: ${MEDIA_VISION_API_KEY:${DEEPSEEK_API_KEY:}}
    model: ${MEDIA_VISION_MODEL:deepseek-flash}

admin:
  enabled: ${ADMIN_ENABLED:true}
  password: ${ADMIN_PASSWORD:}
  internal-token: ${ADMIN_INTERNAL_TOKEN:}

# 消息条数不触发刷新；空闲防抖、调用间隔与锁租期相互独立。
chat:
  buffer:
    debounce-millis: 5000
    min-interval-millis: 8000
    max-text-chars: 32768
    max-images: 8
    lock-lease-millis: 120000
    lock-renew-millis: 10000
