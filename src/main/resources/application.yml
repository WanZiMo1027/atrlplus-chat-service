spring:
  application:
    name: chat-service
  profiles:
    default: snowluma
  data:
    redis:
      host: localhost
      port: 6379
  cloud:
    nacos:
      discovery:
        username: nacos
        password: ${NACOS_PASSWORD}
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:atriplus}
    username: ${POSTGRES_USERNAME:postgres}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver
  config:
    import: optional:classpath:application-local.yml

media:
  vision:
    base-url: ${MEDIA_VISION_BASE_URL:https://api.deepseek.com}
    api-key: ${MEDIA_VISION_API_KEY:${DEEPSEEK_API_KEY:}}
    model: ${MEDIA_VISION_MODEL:deepseek-flash}
