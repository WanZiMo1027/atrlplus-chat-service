spring:
  application:
    name: chat-service
  profiles:
    default: snowluma
  data:
    redis:
      host: localhost
      port: 6379
  cloud:
    nacos:
      discovery:
        username: nacos
        password: ${NACOS_PASSWORD}
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:atriplus}
    username: ${POSTGRES_USERNAME:postgres}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver
  config:
    import: optional:classpath:application-local.yml
